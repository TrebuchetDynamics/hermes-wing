name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "assets/**"
      - "hermes-wing-icon.png"
      - "lib/**"
      - "site/**"
      - "web/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "playwright/tests/regression/pages-landing.spec.mjs"
      - "playwright/support/flutter_semantics.mjs"
      - "scripts/generate_readme_assets.mjs"
      - "test/tooling/pages_artifact_test.mjs"
      - "test/tooling/pages_workflow_contract_test.dart"
      - "test/tooling/readme_assets_contract_test.dart"
      - "test/tooling/wing_branding_assets_test.dart"
      - "README.md"
      - "docs/README.md"
      - "docs/getting-started.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy web app
    # No PR/fork context or non-main manual ref can acquire publishing rights.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        run: |
          flutter pub get
          npm ci
          npx playwright install --with-deps chromium
      - name: Pages source and artifact tooling contracts
        run: |
          node --test test/tooling/pages_artifact_test.mjs
          flutter test --no-pub test/tooling/pages_workflow_contract_test.dart \
            test/tooling/readme_assets_contract_test.dart \
            test/tooling/wing_branding_assets_test.dart
      - name: Build Pages artifact
        run: |
          flutter build web --release --base-href /hermes-wing/app/
          rm -rf build/pages
          mkdir -p build/pages/app build/pages/assets
          cp -a build/web/. build/pages/app/
          cp site/index.html site/styles.css build/pages/
          cp assets/readme/hero.svg build/pages/assets/hero.svg
          cp assets/readme/showcase.png build/pages/assets/showcase.png
          cp assets/readme/showcase-mobile.png build/pages/assets/showcase-mobile.png
          cp assets/readme/runtime-flow.svg build/pages/assets/runtime-flow.svg
          cp assets/readme/runtime-flow-mobile.svg build/pages/assets/runtime-flow-mobile.svg
          cp site/assets/app-icon.png build/pages/assets/app-icon.png
          node site/pages-artifact.mjs stamp build/pages "${GITHUB_SHA}"
      - name: Landing and web client browser smoke
        run: |
          pages_stage="$(mktemp -d "${RUNNER_TEMP}/wing-pages.XXXXXX")"
          trap 'kill "${server_pid:-}" 2>/dev/null || true; rm -rf "$pages_stage"' EXIT
          ln -s "${GITHUB_WORKSPACE}/build/pages" "$pages_stage/hermes-wing"
          python3 -m http.server 8769 --bind 127.0.0.1 --directory "$pages_stage" &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8769/hermes-wing/ >/dev/null; then
              break
            fi
            sleep 1
          done
          PAGES_EXPECTED_REVISION="${GITHUB_SHA}" \
            PAGES_BASE_URL=http://127.0.0.1:8769/hermes-wing/ \
            npx playwright test --config=playwright.config.mjs \
            playwright/tests/regression/pages-landing.spec.mjs --reporter=list
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify deployed landing and web app
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node site/pages-artifact.mjs verify build/pages/artifact.json "${PAGE_URL}"
