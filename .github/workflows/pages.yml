name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "assets/**"
      - "hermes-wing-icon.png"
      - "lib/**"
      - "site/**"
      - "web/**"
      - "pubspec.lock"
      - "pubspec.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy web app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        run: |
          flutter pub get
          npm ci
          npx playwright install --with-deps chromium
      - name: Build Pages artifact
        run: |
          flutter build web --release --base-href /hermes-wing/app/
          rm -rf build/pages
          mkdir -p build/pages/app build/pages/assets
          cp -a build/web/. build/pages/app/
          cp site/index.html site/styles.css build/pages/
          cp assets/readme/hero.svg build/pages/assets/hero.svg
          cp assets/readme/showcase.png build/pages/assets/showcase.png
          cp assets/readme/showcase-mobile.png build/pages/assets/showcase-mobile.png
          cp assets/readme/runtime-flow.svg build/pages/assets/runtime-flow.svg
          cp assets/readme/runtime-flow-mobile.svg build/pages/assets/runtime-flow-mobile.svg
          cp hermes-wing-icon.png build/pages/assets/app-icon.png
      - name: Landing and web client browser smoke
        run: |
          mkdir -p /tmp/hermes-wing-pages
          ln -s "${GITHUB_WORKSPACE}/build/pages" /tmp/hermes-wing-pages/hermes-wing
          python3 -m http.server 8769 --bind 127.0.0.1 --directory /tmp/hermes-wing-pages &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8769/hermes-wing/ >/dev/null; then
              break
            fi
            sleep 1
          done
          PAGES_BASE_URL=http://127.0.0.1:8769/hermes-wing/ \
            npx playwright test --config=playwright.config.mjs \
            playwright/tests/regression/pages-landing.spec.mjs --reporter=list
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify deployed landing and web app
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          page_root="${PAGE_URL%/}/"
          landing="$(curl --fail --silent --show-error "${page_root}?revision=${GITHUB_SHA}")"
          if [[ "$landing" != *'<title>Hermes Wing — Hermes Agent everywhere</title>'* ]]; then
            echo "Deployed root is not the Hermes Wing landing page." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            "${page_root}styles.css?revision=${GITHUB_SHA}" >/dev/null
          app_index="$(curl --fail --silent --show-error "${page_root}app/?revision=${GITHUB_SHA}")"
          if [[ "$app_index" != *'<base href="/hermes-wing/app/">'* ]]; then
            echo "Deployed web app is missing its scoped base href." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            "${page_root}app/flutter_bootstrap.js?revision=${GITHUB_SHA}" >/dev/null
          curl --fail --silent --show-error \
            "${page_root}app/main.dart.js?revision=${GITHUB_SHA}" >/dev/null
