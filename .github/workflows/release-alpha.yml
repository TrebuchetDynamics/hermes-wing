name: Publish alpha release

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: New alpha tag, for example v0.1.0-alpha.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  validation:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.2
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          flutter pub get
          npm ci
      - name: Validate tag against app version
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          app_version=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          app_version=${app_version%%+*}
          tag_prefix="v${app_version}-alpha."
          tag_suffix=${TAG#$tag_prefix}
          if [[ "$TAG" != "${tag_prefix}${tag_suffix}" || ! "$tag_suffix" =~ ^[0-9]+$ ]]; then
            echo "Tag must match app version: v${app_version}-alpha.N" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
      - name: Format, analyze, test, and audit
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test --coverage --concurrency=1
          coverage_percent=$(awk -F'[:,]' '/^DA:/{total++; if ($3 > 0) covered++} END {printf "%.0f", total ? covered * 100 / total : 0}' coverage/lcov.info)
          test "$coverage_percent" -ge 50
          npm audit --audit-level=high

  android:
    name: Signed Android APK and AAB
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.2
          cache: true
      - name: Require release signing secrets
        env:
          KEYSTORE: ${{ secrets.WING_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WING_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WING_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WING_RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.WING_RELEASE_CERT_SHA256 }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$CERT_SHA256"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/wing-release.jks"
      - name: Build signed release APK and AAB
        env:
          WING_RELEASE_STORE_FILE: ${{ runner.temp }}/wing-release.jks
          WING_RELEASE_STORE_PASSWORD: ${{ secrets.WING_RELEASE_STORE_PASSWORD }}
          WING_RELEASE_KEY_ALIAS: ${{ secrets.WING_RELEASE_KEY_ALIAS }}
          WING_RELEASE_KEY_PASSWORD: ${{ secrets.WING_RELEASE_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
          cp build/app/outputs/flutter-apk/app-release.apk hermes-wing-android.apk
          cp build/app/outputs/bundle/release/app-release.aab hermes-wing-android.aab
          sha256sum hermes-wing-android.apk > hermes-wing-android.apk.sha256
          sha256sum hermes-wing-android.aab > hermes-wing-android.aab.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-wing-android-release
          path: |
            hermes-wing-android.apk
            hermes-wing-android.apk.sha256
            hermes-wing-android.aab
            hermes-wing-android.aab.sha256
          if-no-files-found: error

  linux:
    name: Linux release bundle
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: wing_link/go.mod
          cache-dependency-path: wing_link/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.2
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev ninja-build pkg-config
      - name: Build Linux release archive
        run: |
          flutter pub get
          flutter build linux --release
          tar -C build/linux/x64/release -czf hermes-wing-linux-x64.tar.gz bundle
          sha256sum hermes-wing-linux-x64.tar.gz > hermes-wing-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-wing-linux-release
          path: |
            hermes-wing-linux-x64.tar.gz
            hermes-wing-linux-x64.tar.gz.sha256
          if-no-files-found: error

  web:
    name: Web release archive
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.2
          cache: true
      - name: Build web release archive
        run: |
          flutter pub get
          flutter build web --release
          tar -C build/web -czf hermes-wing-web.tar.gz .
          sha256sum hermes-wing-web.tar.gz > hermes-wing-web.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-wing-web-release
          path: |
            hermes-wing-web.tar.gz
            hermes-wing-web.tar.gz.sha256
          if-no-files-found: error

  wing-link:
    name: Wing Link host binaries
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: wing_link/go.mod
          cache-dependency-path: wing_link/go.sum
      - name: Test and build Wing Link targets
        working-directory: wing_link
        env:
          CGO_ENABLED: "0"
          TAG: ${{ inputs.tag }}
        run: |
          go test ./...
          version=${TAG#v}
          ldflags="-s -w -X main.version=${version}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$ldflags" -o ../wing-link-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$ldflags" -o ../wing-link-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$ldflags" -o ../wing-link-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$ldflags" -o ../wing-link-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$ldflags" -o ../wing-link-windows-amd64.exe .
          GOOS=android GOARCH=arm64 go build -trimpath -buildmode=pie -ldflags="$ldflags" -o ../wing-link-android-arm64 .
      - name: Generate Wing Link checksums
        run: sha256sum wing-link-* > wing-link-checksums.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wing-link-release
          path: |
            wing-link-linux-amd64
            wing-link-linux-arm64
            wing-link-darwin-amd64
            wing-link-darwin-arm64
            wing-link-windows-amd64.exe
            wing-link-android-arm64
            wing-link-checksums.sha256
          if-no-files-found: error

  verify-artifacts:
    name: Verify and smoke exact release artifacts
    needs: [android, linux, web, wing-link]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Install artifact verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl file libgtk-3-0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libsecret-1-0 qemu-user-static unzip xvfb
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify checksums, signatures, archives, and runnable artifacts
        env:
          TAG: ${{ inputs.tag }}
          WING_RELEASE_CERT_SHA256: ${{ secrets.WING_RELEASE_CERT_SHA256 }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f -print | sort -V | tail -1)
          export APKSIGNER
          ./scripts/verify_release_artifacts.sh dist "$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-wing-verified-release
          path: dist/**
          if-no-files-found: error

  android-artifact-smoke:
    name: Install and launch exact release APK
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hermes-wing-android-release
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Verify, install, and launch release APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          TAG: ${{ inputs.tag }}
          WING_RELEASE_CERT_SHA256: ${{ secrets.WING_RELEASE_CERT_SHA256 }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            manifest_name=$(awk 'NF == 2 {print $2}' hermes-wing-android.apk.sha256)
            test "$(wc -l < hermes-wing-android.apk.sha256)" -eq 1
            test "$manifest_name" = hermes-wing-android.apk || { echo "checksum manifest does not exactly cover expected artifacts" >&2; exit 1; }
            sha256sum -c hermes-wing-android.apk.sha256
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f -print | sort -V | tail -1)
            mapfile -t actual_signers < <($APKSIGNER verify --print-certs hermes-wing-android.apk | awk -F': ' '/Signer #[0-9]+ certificate SHA-256 digest:/{gsub(/:|[[:space:]]/, "", $2); print tolower($2)}')
            expected=$(printf '%s' "$WING_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
            test -n "$expected"
            test "${#actual_signers[@]}" -eq 1
            test "${actual_signers[0]}" = "$expected"
            adb install hermes-wing-android.apk
            adb logcat -c
            adb shell am start -W -n com.trebuchetdynamics.hermes.wing/.MainActivity
            sleep 5
            adb shell pidof com.trebuchetdynamics.hermes.wing
            adb uninstall com.trebuchetdynamics.hermes.wing
            printf 'tag=%s\nsource_revision=%s\nresult=verified-installed-launched\n' "$TAG" "$GITHUB_SHA" > android-artifact-smoke.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-artifact-smoke-receipt
          path: android-artifact-smoke.txt
          if-no-files-found: error

  wing-link-macos-smoke:
    name: Run exact Wing Link macOS artifact
    needs: wing-link
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wing-link-release
      - name: Verify and run the native macOS binary
        env:
          TAG: ${{ inputs.tag }}
        run: |
          expected=$(printf '%s\n' wing-link-android-arm64 wing-link-darwin-amd64 wing-link-darwin-arm64 wing-link-linux-amd64 wing-link-linux-arm64 wing-link-windows-amd64.exe | sort)
          actual=$(awk 'NF == 2 && $1 ~ /^[0-9a-fA-F]+$/ && $2 !~ /[\\\/]/ {print $2}' wing-link-checksums.sha256 | sort)
          test "$(wc -l < wing-link-checksums.sha256)" -eq 6 && test "$actual" = "$expected" || { echo "checksum manifest does not exactly cover expected artifacts" >&2; exit 1; }
          shasum -a 256 -c wing-link-checksums.sha256
          file wing-link-darwin-amd64 | grep -q 'Mach-O 64-bit'
          file wing-link-darwin-arm64 | grep -q 'Mach-O 64-bit'
          case "$(uname -m)" in
            arm64) binary=wing-link-darwin-arm64 ;;
            x86_64) binary=wing-link-darwin-amd64 ;;
            *) echo "unsupported macOS runner architecture" >&2; exit 1 ;;
          esac
          chmod +x "$binary"
          test "$(./$binary version)" = "${TAG#v}"
          printf 'tag=%s\nsource_revision=%s\nbinary=%s\nresult=verified-ran-version\n' "$TAG" "$GITHUB_SHA" "$binary" > wing-link-macos-smoke.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wing-link-macos-smoke-receipt
          path: wing-link-macos-smoke.txt
          if-no-files-found: error

  wing-link-windows-smoke:
    name: Run exact Wing Link Windows artifact
    needs: wing-link
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wing-link-release
      - name: Verify and run the Windows binary
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $expectedFiles = @('wing-link-android-arm64', 'wing-link-darwin-amd64', 'wing-link-darwin-arm64', 'wing-link-linux-amd64', 'wing-link-linux-arm64', 'wing-link-windows-amd64.exe')
          $manifest = @(Get-Content wing-link-checksums.sha256)
          $entries = @($manifest | ForEach-Object {
            if ($_ -notmatch '^([0-9a-fA-F]{64}) [ *]([^/\\]+)$') { throw 'checksum manifest does not exactly cover expected artifacts' }
            [pscustomobject]@{ Hash = $Matches[1].ToLowerInvariant(); Name = $Matches[2] }
          })
          if ($entries.Count -ne $expectedFiles.Count -or (Compare-Object ($entries.Name | Sort-Object -Unique) $expectedFiles)) { throw 'checksum manifest does not exactly cover expected artifacts' }
          $entries | ForEach-Object {
            $actual = (Get-FileHash -Algorithm SHA256 $_.Name).Hash.ToLowerInvariant()
            if ($actual -ne $_.Hash) { throw "checksum mismatch: $($_.Name)" }
          }
          $actualVersion = (& .\wing-link-windows-amd64.exe version).Trim()
          $expectedVersion = $env:TAG.TrimStart('v')
          if ($actualVersion -ne $expectedVersion) { throw "version mismatch" }
          "tag=$env:TAG`nsource_revision=$env:GITHUB_SHA`nbinary=wing-link-windows-amd64.exe`nresult=verified-ran-version" | Set-Content wing-link-windows-smoke.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wing-link-windows-smoke-receipt
          path: wing-link-windows-smoke.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs:
      - verify-artifacts
      - android-artifact-smoke
      - wing-link-macos-smoke
      - wing-link-windows-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hermes-wing-verified-release
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-smoke-receipt"
          path: dist
          merge-multiple: true
      - name: Publish verified prerelease
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hermes Wing $TAG" \
            --notes "Verified alpha release with a signed Android APK/AAB, Linux x64 bundle, static web archive, Wing Link binaries, checksums, and a pre-publication verification receipt. See README.md for support limits." \
            --prerelease
