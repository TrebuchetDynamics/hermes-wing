appId: com.trebuchetdynamics.hermes.wing
name: Real gateway regression
tags:
  - device
  - regression
  - real-gateway
---
- launchApp:
    clearState: false
    stopApp: true
- setOrientation: PORTRAIT

# Two bounded app-bar back taps normalize nested routes to the gateway directory.
- tapOn:
    point: "7%,8%"
- tapOn:
    point: "7%,8%"
- extendedWaitUntil:
    visible: "Open more destinations"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "(?s).*${WING_QA_GATEWAY_LABEL}.*${WING_QA_PROFILE_LABEL}.*online.*"
    direction: DOWN
    timeout: 30000
- tapOn: "(?s).*${WING_QA_GATEWAY_LABEL}.*${WING_QA_PROFILE_LABEL}.*online.*"
- extendedWaitUntil:
    visible: "Message Hermes…"
    timeout: 60000

# Exercise a real session mutation, run submission, SSE completion, and usage.
- tapOn: "More actions"
- tapOn: "New session"
- extendedWaitUntil:
    visible: "How can Hermes help today?"
    timeout: 30000
- tapOn:
    point: "50%,90%"
- inputText: "Join these four uppercase words with hyphens and reply with only the result: REAL WING RUN OK"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "(?s).*REAL-WING-RUN-OK.*"
    timeout: 120000
- assertVisible: "(?s).*Latest Hermes run.*total.*"
- assertNotVisible: "(?s).*HttpException.*"

# A second real turn verifies session continuity rather than only first-turn chat.
- tapOn:
    point: "50%,90%"
- inputText: "Without tools or external actions replace the spaces in phrase REAL WING CONTEXT OK with hyphens and reply with only the result"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "(?s).*REAL-WING-CONTEXT-OK.*"
    timeout: 120000
- assertNotVisible: "(?s).*HttpException.*"

# Stop a server-owned run, then prove the same session remains usable.
- tapOn:
    point: "50%,90%"
- inputText: "Without tools or external actions write five hundred words about a brass telescope"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Stop"
    timeout: 30000
- tapOn: "Stop"
- extendedWaitUntil:
    notVisible: "Stop"
    timeout: 30000
- tapOn:
    point: "50%,90%"
- inputText: "Join these three uppercase words with hyphens and reply with only the result: REAL WING RECOVERED"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "(?s).*REAL-WING-RECOVERED.*"
    timeout: 120000
- assertNotVisible: "(?s).*HttpException.*"

# Kill and relaunch the real APK, then verify authoritative transcript recovery.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "(?s).*REAL-WING-RECOVERED.*"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "(?s).*REAL-WING-CONTEXT-OK.*"
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "(?s).*REAL-WING-RUN-OK.*"
    direction: UP
    timeout: 30000
- assertNotVisible: "(?s).*HttpException.*"

# Leave and reopen the contact to cover directory-to-session restoration.
- tapOn: "All chats"
- scrollUntilVisible:
    element:
      text: "(?s).*${WING_QA_GATEWAY_LABEL}.*${WING_QA_PROFILE_LABEL}.*online.*"
    direction: DOWN
    timeout: 30000
- tapOn: "(?s).*${WING_QA_GATEWAY_LABEL}.*${WING_QA_PROFILE_LABEL}.*online.*"
- extendedWaitUntil:
    visible: "(?s).*REAL-WING-RECOVERED.*"
    timeout: 60000

# Exercise the unsupported-playback trust boundary in the full regression.
# Restore reply speech to disabled before leaving the flow.
- tapOn: "All chats"
- tapOn: "Open more destinations"
- scrollUntilVisible:
    element:
      text: "^Settings$"
    direction: DOWN
    timeout: 30000
- tapOn: "^Settings$"
- scrollUntilVisible:
    element:
      text: "(?s).*Speak replies aloud.*"
    direction: DOWN
    timeout: 30000
- runFlow:
    when:
      visible:
        text: "(?s).*Speak replies aloud.*"
        checked: false
    commands:
      - tapOn: "(?s).*Speak replies aloud.*"
- tapOn: "Open more destinations"
- scrollUntilVisible:
    element:
      text: "^Hermes$"
    direction: UP
    timeout: 30000
- tapOn: "^Hermes$"
- extendedWaitUntil:
    visible: "Open more destinations"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "(?s).*${WING_QA_GATEWAY_LABEL}.*${WING_QA_PROFILE_LABEL}.*online.*"
    direction: DOWN
    timeout: 30000
- tapOn: "(?s).*${WING_QA_GATEWAY_LABEL}.*${WING_QA_PROFILE_LABEL}.*online.*"
- tapOn:
    point: "50%,90%"
- inputText: "Reply exactly VOICE-E2E-OK"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "(?s).*VOICE-E2E-OK.*"
    timeout: 120000
- extendedWaitUntil:
    visible: "(?s).*Voice output unavailable.*"
    timeout: 30000
- assertVisible: "(?s).*The reply is available as text.*"
- assertVisible: "(?s).*Voice input remains available from the microphone.*"
- takeScreenshot: voice_output_fallback
- tapOn: "Continue in text"
- assertNotVisible: "(?s).*Voice output unavailable.*"
- hideKeyboard
- tapOn: "All chats"
- tapOn: "Open more destinations"
- scrollUntilVisible:
    element:
      text: "^Settings$"
    direction: DOWN
    timeout: 30000
- tapOn: "^Settings$"
- scrollUntilVisible:
    element:
      text: "(?s).*Speak replies aloud.*"
    direction: DOWN
    timeout: 30000
- runFlow:
    when:
      visible:
        text: "(?s).*Speak replies aloud.*"
        checked: true
    commands:
      - tapOn: "(?s).*Speak replies aloud.*"
