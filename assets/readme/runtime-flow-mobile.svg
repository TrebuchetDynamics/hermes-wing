<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Wing trust and runtime path for mobile</title>
  <desc id="desc">A vertical five-stage flow from a reviewed private endpoint through capability negotiation, a durable Hermes session, streamed run events, and visible approval or stop controls.</desc>

  <rect width="600" height="760" rx="28" fill="#111214"/>
  <text x="38" y="34" dominant-baseline="hanging" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="750">Hermes stays authoritative.</text>
  <text x="40" y="82" dominant-baseline="hanging" fill="#8f96a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1">TRUST → CAPABILITIES → CONTROL</text>

  <path d="M86 163V615" stroke="#30343b" stroke-width="4" stroke-linecap="round"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(40 126)">
      <circle cx="46" cy="46" r="40" fill="#1b1d21" stroke="#565b65"/>
      <path d="M27 45h38v27H27zM34 45v-9a12 12 0 0 1 24 0v9" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linejoin="round"/>
      <text x="118" y="20" dominant-baseline="hanging" fill="#f4f4f5" font-size="23" font-weight="700">Trusted origin</text>
      <text x="118" y="55" dominant-baseline="hanging" fill="#8f96a3" font-size="17">review the endpoint</text>
    </g>

    <g transform="translate(40 238)">
      <circle cx="46" cy="46" r="40" fill="#1b1d21" stroke="#565b65"/>
      <path d="M25 31h42M25 45h30M25 59h36" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="67" cy="59" r="5" fill="#3b82f6"/>
      <text x="118" y="20" dominant-baseline="hanging" fill="#f4f4f5" font-size="23" font-weight="700">Capabilities</text>
      <text x="118" y="55" dominant-baseline="hanging" fill="#8f96a3" font-size="17">enable only advertised APIs</text>
    </g>

    <g transform="translate(40 350)">
      <circle cx="46" cy="46" r="40" fill="#1b1d21" stroke="#3b82f6" stroke-width="2"/>
      <path d="M25 31h42v30H42L30 71V61h-5z" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round"/>
      <text x="118" y="20" dominant-baseline="hanging" fill="#f4f4f5" font-size="23" font-weight="700">Hermes session</text>
      <text x="118" y="55" dominant-baseline="hanging" fill="#8f96a3" font-size="17">durable conversation context</text>
    </g>

    <g transform="translate(40 462)">
      <circle cx="46" cy="46" r="40" fill="#1b1d21" stroke="#3b82f6" stroke-width="2"/>
      <path d="M21 54h10l8-21 12 37 9-23h12" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="118" y="20" dominant-baseline="hanging" fill="#f4f4f5" font-size="23" font-weight="700">Stream events</text>
      <text x="118" y="55" dominant-baseline="hanging" fill="#8f96a3" font-size="17">runs, tools, and usage</text>
    </g>

    <g transform="translate(40 574)">
      <circle cx="46" cy="46" r="40" fill="#1b1d21" stroke="#3b82f6" stroke-width="2"/>
      <path d="M25 47l13 13 29-31" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="118" y="20" dominant-baseline="hanging" fill="#f4f4f5" font-size="23" font-weight="700">Approve or stop</text>
      <text x="118" y="55" dominant-baseline="hanging" fill="#8f96a3" font-size="17">the operator decides</text>
    </g>
  </g>

  <g fill="#3b82f6">
    <path d="M86 230l-8-13h16z"/>
    <path d="M86 342l-8-13h16z"/>
    <path d="M86 454l-8-13h16z"/>
    <path d="M86 566l-8-13h16z"/>
  </g>

  <text x="40" y="712" dominant-baseline="hanging" fill="#8f96a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Wing is a client—not a second Hermes backend.</text>
</svg>
