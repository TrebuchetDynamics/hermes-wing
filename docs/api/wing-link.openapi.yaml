"components":
  "securitySchemes":
    "WingLinkBearer":
      "type": "http"
      "scheme": "bearer"
      "description": "Separate Wing Link device credential. Exact per-operation grants required; pending credentials only where explicitly stated. Hermes API keys are not accepted."
    "LocalPairingProof":
      "type": "apiKey"
      "in": "header"
      "name": "X-Wing-Link-Local-Proof"
      "description": "Owner-only local proof AND loopback RemoteAddr required. This is not a remote authentication alternative."
  "parameters":
    "Protocol":
      "name": "Wing-Protocol"
      "in": "header"
      "required": false
      "schema":
        "type": "integer"
        "enum":
          - 1
          - 2
        "default": 1
      "description": "Omission, empty or whitespace-only values select generation 1. The handler trims whitespace and parses a decimal integer (so +2 and 02 also select 2). Invalid, older, or future values return 426 before route authorization (except initialized GET /meta). Unsafe host initialization returns 503 before negotiation. The schema describes canonical client values, not every accepted spelling."
    "Idempotency":
      "name": "Idempotency-Key"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "minLength": 1
        "maxLength": 128
      "description": "Bounded identifier. Bind to device, method/route and payload digest. Reuse only for the identical request."
    "IfMatch":
      "name": "If-Match"
      "in": "header"
      "required": false
      "schema":
        "type": "string"
      "description": "Opaque profile revision. Required for DELETE; PATCH may supply revision in its body."
  "schemas":
    "APIError":
      "type": "object"
      "properties":
        "code":
          "type": "string"
        "message":
          "type": "string"
          "maxLength": 240
      "required":
        - "code"
        - "message"
      "additionalProperties": false
    "Error":
      "type": "object"
      "properties":
        "error":
          "$ref": "#/components/schemas/APIError"
        "outcome":
          "type": "string"
          "enum":
            - "applied"
            - "not_applied"
            - "unknown"
        "operation_id":
          "type": "string"
      "required":
        - "error"
      "additionalProperties": false
    "UpgradeError":
      "type": "object"
      "properties":
        "error":
          "$ref": "#/components/schemas/APIError"
        "minimum_protocol_generation":
          "const": 1
        "protocol_generation":
          "const": 2
      "required":
        - "error"
        - "minimum_protocol_generation"
        - "protocol_generation"
      "additionalProperties": false
    "Metadata":
      "type": "object"
      "properties":
        "protocol_generation":
          "const": 2
        "minimum_protocol_generation":
          "const": 1
        "supported_protocol_generations":
          "type": "array"
          "const": [1, 2]
        "version":
          "type": "string"
          "maxLength": 64
        "host_fingerprint":
          "type": "string"
          "maxLength": 96
        "capabilities":
          "type": "array"
          "items":
            "type": "string"
      "required":
        - "protocol_generation"
        - "minimum_protocol_generation"
        - "supported_protocol_generations"
        - "version"
        - "host_fingerprint"
        - "capabilities"
      "additionalProperties": false
    "Status":
      "type": "object"
      "properties":
        "status":
          "const": "ok"
        "protocol_version":
          "const": 2
      "required":
        - "status"
        - "protocol_version"
      "additionalProperties": false
    "Acknowledged":
      "type": "object"
      "properties":
        "acknowledged":
          "const": true
      "required":
        - "acknowledged"
      "additionalProperties": false
    "CredentialAcknowledged":
      "type": "object"
      "properties":
        "credential_id":
          "type": "string"
        "acknowledged":
          "const": true
      "required":
        - "credential_id"
        - "acknowledged"
      "additionalProperties": false
    "StageCredentialRequest":
      "type": "object"
      "properties":
        "name":
          "type": "string"
          "maxLength": 80
        "scopes":
          "type": "array"
          "items":
            "type": "string"
            "enum":
              - "setup:write"
              - "lifecycle:write"
              - "health:read"
              - "diagnostics:read"
              - "profiles:read"
              - "profiles:write"
              - "providers:read"
              - "providers:write"
              - "directories:read"
              - "device:self:read"
              - "device:self:revoke"
          "uniqueItems": true
          "maxItems": 11
      "additionalProperties": false
    "StagedCredential":
      "type": "object"
      "properties":
        "credential_id":
          "type": "string"
        "token":
          "type": "string"
          "format": "password"
          "description": "Sensitive pending Wing Link bearer credential. Store securely, never in a URL or handoff."
      "required":
        - "credential_id"
        - "token"
      "additionalProperties": false
    "DeviceSelf":
      "type": "object"
      "properties":
        "device_id":
          "type": "string"
        "name":
          "type": "string"
        "scopes":
          "type": "array"
          "items":
            "type": "string"
        "created_at":
          "type": "string"
          "format": "date-time"
        "legacy":
          "type": "boolean"
        "last_used_at":
          "type": "string"
          "format": "date-time"
        "expires_at":
          "type": "string"
          "format": "date-time"
      "required":
        - "device_id"
        - "name"
        - "scopes"
        - "created_at"
        - "legacy"
      "additionalProperties": false
    "Directory":
      "type": "object"
      "properties":
        "handle":
          "type": "string"
          "description": "Opaque, expiring, device-bound handle. Never a host path."
        "name":
          "type": "string"
      "required":
        - "handle"
        - "name"
      "additionalProperties": false
    "DirectoryList":
      "type": "object"
      "properties":
        "directories":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Directory"
        "next_offset":
          "type": "integer"
      "required":
        - "directories"
      "additionalProperties": false
    "ModelProvider":
      "type": "object"
      "properties":
        "slug":
          "type": "string"
          "minLength": 1
          "maxLength": 80
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 160
        "models":
          "type": "array"
          "items":
            "type": "string"
            "minLength": 1
            "maxLength": 200
      "required":
        - "slug"
        - "name"
        - "models"
      "additionalProperties": false
    "ModelCatalog":
      "type": "object"
      "properties":
        "providers":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ModelProvider"
          "maxItems": 128
      "required":
        - "providers"
      "additionalProperties": false

    "UpdateStatus":
      "type": "object"
      "properties":
        "state":
          "type": "string"
          "enum":
            - "unavailable"
            - "idle"
        "current_version":
          "type": "string"
        "reason":
          "type": "string"
          "enum":
            - "release_keys_empty"
            - "activation_not_configured"
            - ""
      "required":
        - "state"
        - "current_version"
        - "reason"
      "additionalProperties": false
    "UpdateApplied":
      "type": "object"
      "properties":
        "operation_id":
          "type": "string"
        "from_version":
          "type": "string"
        "to_version":
          "type": "string"
      "required":
        - "operation_id"
        - "from_version"
        - "to_version"
      "additionalProperties": false
    "EmptyRequest":
      "type": "object"
      "properties": {}
      "additionalProperties": false
    "OperationEvent":
      "type": "object"
      "properties":
        "protocol_version":
          "type": "integer"
        "operation_id":
          "type": "string"
        "phase":
          "type": "string"
        "message":
          "type": "string"
          "maxLength": 240
        "percent":
          "type": "integer"
        "terminal":
          "type": "boolean"
        "error_code":
          "type": "string"
      "required":
        - "protocol_version"
        - "operation_id"
        - "phase"
        - "message"
        - "percent"
      "additionalProperties": false
    "OperationAccepted":
      "type": "object"
      "properties":
        "protocol_version":
          "const": 2
        "operation_id":
          "type": "string"
      "required":
        - "protocol_version"
        - "operation_id"
      "additionalProperties": false
    "OperationReplay":
      "type": "object"
      "properties":
        "protocol_version":
          "const": 2
        "operation_id":
          "type": "string"
        "operation":
          "$ref": "#/components/schemas/OperationEvent"
        "replayed":
          "const": true
      "required":
        - "protocol_version"
        - "operation_id"
        - "operation"
        - "replayed"
      "additionalProperties": false
    "ApprovalRequired":
      "type": "object"
      "properties":
        "error":
          "$ref": "#/components/schemas/APIError"
        "approval_id":
          "type": "string"
        "operation_id":
          "type": "string"
        "expires_at":
          "type": "integer"
          "description": "Unix seconds, not an RFC 3339 string."
      "required":
        - "error"
        - "approval_id"
        - "operation_id"
        - "expires_at"
      "additionalProperties": false
    "ApprovalOrReplay":
      "oneOf":
        -
          "$ref": "#/components/schemas/ApprovalRequired"
        -
          "$ref": "#/components/schemas/OperationReplay"
    "SetupAccepted":
      "oneOf":
        -
          "$ref": "#/components/schemas/ApprovalRequired"
        -
          "$ref": "#/components/schemas/OperationReplay"
        -
          "$ref": "#/components/schemas/OperationAccepted"
    "ProfileAction":
      "type": "object"
      "properties":
        "revision":
          "type": "string"
      "required":
        - "revision"
      "additionalProperties": false
    "ProfileActions":
      "type": "object"
      "properties":
        "rename":
          "$ref": "#/components/schemas/ProfileAction"
        "delete":
          "$ref": "#/components/schemas/ProfileAction"
      "additionalProperties": false
    "Profile":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "name":
          "type": "string"
        "source":
          "type": "string"
        "revision":
          "type": "string"
        "topology_revision":
          "type": "string"
        "description":
          "type": "string"
        "model":
          "type": "string"
        "skills_count":
          "type": "integer"
        "gateway_state":
          "type": "string"
        "actions":
          "$ref": "#/components/schemas/ProfileActions"
      "required":
        - "id"
        - "name"
        - "source"
        - "revision"
        - "topology_revision"
        - "gateway_state"
        - "actions"
      "additionalProperties": false
    "ProfileResponse":
      "type": "object"
      "properties":
        "profile":
          "$ref": "#/components/schemas/Profile"
      "required":
        - "profile"
      "additionalProperties": false
    "ProfileList":
      "type": "object"
      "properties":
        "protocol_version":
          "const": 2
        "profiles":
          "type":
            - "array"
            - "null"
          "items":
            "$ref": "#/components/schemas/Profile"
        "warnings":
          "type":
            - "array"
            - "null"
          "items":
            "type": "string"
      "required":
        - "protocol_version"
        - "profiles"
        - "warnings"
      "additionalProperties": false
    "ProfileCreateRequest":
      "type": "object"
      "properties":
        "name":
          "type": "string"
          "description": "Trimmed and lowercased, then validated against ^[a-z0-9][a-z0-9_-]{0,63}$. Reserved IDs cannot be changed."
        "clone_from":
          "type": "string"
        "description":
          "type": "string"
          "description": "After trimming: at most 500 runes and no control characters."
        "provider":
          "type": "string"
          "description": "Trimmed, lowercased allowlist: nous, fireworks, openrouter, moa, novita, lmstudio, anthropic, openai-codex, openai-api, alibaba, xai-oauth, xiaomi, tencent-tokenhub, nvidia, copilot, copilot-acp, huggingface, gemini, vertex, deepseek, xai, zai, kimi-coding, kimi-coding-cn, stepfun, minimax, minimax-oauth, minimax-cn, ollama-cloud, arcee, gmi, kilocode, opencode-zen, opencode-go, bedrock, azure-foundry, ai-gateway, qwen-oauth. Provider and model must both be blank or both nonblank."
        "model":
          "type": "string"
          "description": "After trimming: at most 200 runes and no control characters."
        "provider_api_key":
          "type": "string"
          "format": "password"
          "writeOnly": true
          "description": "At most 16384 bytes, no CR/LF/NUL. Requires a supported provider. Nonblank after trimming requires local sensitive-write approval. Sent to Hermes through stdin only."
      "required":
        - "name"
      "additionalProperties": false
    "ProfileRenameRequest":
      "type": "object"
      "properties":
        "name":
          "type": "string"
        "revision":
          "type": "string"
          "description": "Body revision takes precedence over If-Match after trimming."
        "description":
          "type": "string"
          "description": "Only blank after trimming is accepted."
        "provider":
          "type": "string"
          "description": "Only blank after trimming is accepted."
        "model":
          "type": "string"
          "description": "Only blank after trimming is accepted."
        "provider_api_key":
          "type": "string"
          "writeOnly": true
          "description": "Only the empty string is accepted. Existing-profile secret writes are not supported."
      "required":
        - "name"
      "additionalProperties": false
    "ProfileDeleted":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "deleted":
          "const": true
      "required":
        - "id"
        - "deleted"
      "additionalProperties": false
    "BrokerRequest":
      "type": "object"
      "properties":
        "origin":
          "type": "string"
          "description": "Must equal this ephemeral broker origin exactly, not the Agent or management origin."
        "code":
          "type": "string"
          "format": "password"
          "writeOnly": true
          "description": "Five-minute pairing code. Never persist, log, or analyze it."
      "required":
        - "origin"
        - "code"
      "additionalProperties": false
    "BrokerError":
      "type": "object"
      "properties":
        "error":
          "type": "string"
      "required":
        - "error"
      "additionalProperties": false
    "BrokerInspection":
      "type": "object"
      "properties":
        "label":
          "type": "string"
        "origin":
          "type": "string"
        "wing_link_origin":
          "type": "string"
        "credential_mode":
          "type": "string"
        "access_label":
          "type": "string"
        "scopes":
          "type": "array"
          "items":
            "type": "string"
        "connection_count":
          "type": "integer"
        "host_fingerprint":
          "type": "string"
        "protocol_generation":
          "const": 2
        "expires_at":
          "type": "integer"
      "required":
        - "label"
        - "origin"
        - "wing_link_origin"
        - "credential_mode"
        - "access_label"
        - "scopes"
        - "connection_count"
        - "host_fingerprint"
        - "protocol_generation"
        - "expires_at"
      "additionalProperties": false
    "AgentConnection":
      "type": "object"
      "properties":
        "profile_id":
          "type": "string"
        "origin":
          "type": "string"
        "token":
          "type": "string"
          "format": "password"
        "credential_id":
          "type": "string"
        "label":
          "type": "string"
      "required":
        - "profile_id"
        - "origin"
        - "token"
        - "credential_id"
        - "label"
      "additionalProperties": false
    "BrokerExchange":
      "type": "object"
      "properties":
        "token":
          "type": "string"
          "format": "password"
          "description": "Separate Hermes Agent credential, not a Wing Link credential."
        "label":
          "type": "string"
        "credential_id":
          "type": "string"
        "wing_link_origin":
          "type": "string"
        "wing_link_token":
          "type": "string"
          "format": "password"
        "wing_link_credential_id":
          "type": "string"
        "wing_link_scopes":
          "type": "array"
          "items":
            "type": "string"
        "device_id":
          "type": "string"
        "device_scopes":
          "type": "array"
          "items":
            "type": "string"
        "host_fingerprint":
          "type": "string"
        "protocol_generation":
          "const": 2
        "connections":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/AgentConnection"
      "required":
        - "token"
        - "label"
        - "credential_id"
        - "wing_link_origin"
        - "wing_link_token"
        - "wing_link_credential_id"
        - "wing_link_scopes"
        - "device_id"
        - "device_scopes"
        - "host_fingerprint"
        - "protocol_generation"
      "additionalProperties": false
  "headers":
    "CacheControl":
      "schema":
        "const": "no-store"
      "description": "Do not cache responses."
    "WingProtocol":
      "schema":
        "type": "string"
        "enum":
          - "2"
      "description": "Current management protocol generation."
"x-authority":
  "mode": "code-first"
  "routes":
    - "wing_link/internal/app/serve.go"
    - "wing_link/internal/app/bootstrap_server.go"
    - "wing_link/internal/app/pair.go"
    - "wing_link/internal/app/pair_open.go"
  "contracts":
    - "docs/adr/api-and-state.md"
    - "docs/adr/runtime-and-delivery.md"
    - "docs/adr/security-and-privacy.md"
    - "docs/product/wing-link.md"
    - "docs/security/threat-model.md"
  "tests":
    - "wing_link/internal/app/serve_test.go"
    - "wing_link/internal/app/bootstrap_test.go"
    - "wing_link/internal/app/local_pairing_proof_test.go"
    - "wing_link/internal/app/workspaces_test.go"
    - "wing_link/internal/app/model_options_test.go"
    - "wing_link/internal/app/omniroute_retirement_test.go"
    - "wing_link/internal/app/pair_test.go"
