      "summary": "Read protocol metadata"
      "description": "Unauthenticated discovery. GET /meta bypasses request protocol negotiation, including malformed values, only after successful host initialization. Unsafe approval, audit or local pairing proof state replaces discovery with 503 host_state_unavailable before negotiation or dispatch. Optional capabilities reflect initialized components, not broad write permission. Other methods and trailing-slash paths fall through to empty 404 for supported protocol values; invalid protocol values return 426 first."
      "tags":
        - "Management"
      "x-code-reference":
        - "wing_link/internal/app/serve.go"
        - "wing_link/internal/protocol/metadata.go"
      "security": []
      "responses":
        "200":
          "description": "Successful response."
          "headers":
            "Cache-Control":
              "$ref": "#/components/headers/CacheControl"
            "Wing-Protocol":
              "$ref": "#/components/headers/WingProtocol"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Metadata"
        "503":
          "description": "Host state or this operation is unavailable."
          "headers":
            "Cache-Control":
              "$ref": "#/components/headers/CacheControl"
            "Wing-Protocol":
              "$ref": "#/components/headers/WingProtocol"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "default":
          "description": "Other handler-specific errors (including empty 404/405 dispatch responses). See the cited handler. Not every error carries JSON."
          "headers":
            "Cache-Control":
              "$ref": "#/components/headers/CacheControl"
            "Wing-Protocol":
              "$ref": "#/components/headers/WingProtocol"
      "parameters": []
