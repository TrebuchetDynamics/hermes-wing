# Code-first documentation; Go handlers remain authoritative.
"openapi": "3.1.0"
"info":
  "title": "Wing Link code-first HTTP contract"
  "version": "protocol-2-source-snapshot"
  "description": "Documentation of the current owned Go implementation, not schema-first authority or release qualification. ServeHTTP in wing_link/internal/app/serve.go owns management routing; bootstrap_server.go and route handlers own behavior. Pairing broker operations use a separate ephemeral server in pair.go. Agent chat, sessions, runs, tools, approvals, Projects, existing-profile configuration and general provider administration are not Wing Link routes.\n\nManagement responses send Cache-Control: no-store and Wing-Protocol: 2. GET /meta bypasses negotiation; all other requests default to generation 1 when Wing-Protocol is absent and accept only 1 or 2. Unsupported generations return 426 before route authorization. An initialization failure may replace every management response with 503 host_state_unavailable. Bearer grants are exact strings, not OAuth scopes; required grants and pending-token exceptions are operation extensions. Remote access requires TLS 1.3 and reviewed SPKI pinning for native clients; HTTP is loopback-only. Browser clients require normally trusted HTTPS. Never merge Agent and Wing Link credentials.\n\nSchema limits: this is a manually maintained code-first snapshot. It models named successful operations and concrete response shapes, not every parser tolerance. Go JSON decoding accepts null for structs and scalar fields in ways the client object schemas do not enumerate. decodeJSON rejects unknown fields and trailing data and caps bodies at 64 KiB, but does not enforce Content-Type. Local credential staging and broker decoders have different limits and do not reject trailing JSON. Method mismatch may be empty 405 or fall through to empty 404 depending on dispatch; unsupported protocol can preempt either. Path parsers can accept trimmed slash aliases not repeated here. Default responses document these dispatch errors, not a universal typed error envelope. Local trust approval, containment, TLS/pinning, total catalog byte/model limits and cross-field validation are prose/source obligations, not guarantees provided by OpenAPI validation. No SSE endpoint exists: operations are polled. No runtime, device, update activation or installed-Agent qualification was performed to create this document."
"servers":
