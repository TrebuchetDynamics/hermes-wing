  "/v1/operator/enrollments/inspect":
    "post":
      "operationId": "inspectPairing"
      "summary": "Inspect pairing review"
      "description": "Separate ephemeral pairing broker only, not management ServeHTTP. Five-minute code/origin authority is in the body, not bearer authentication. Body limit 4 KiB. Unknown fields are rejected; trailing JSON is not checked. Exchange returns separate Agent and pending Wing Link credentials and reuses the issued bundle on retries until expiry/acknowledgment closes the broker. Never copy secrets to examples, URLs, logs or ordinary preferences."
      "tags":
        - "Pairing broker"
      "x-code-reference":
        - "wing_link/internal/app/pair.go"
      "security": []
      "responses":
        "200":
          "description": "Successful response."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BrokerInspection"
        "404":
          "description": "Malformed payload, wrong origin/code or expired code."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BrokerError"
        "405":
          "description": "Wrong method."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BrokerError"
      "requestBody":
        "required": true
        "description": "JSON client shape. See parser limitations in info.description."
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/BrokerRequest"
      "servers":
        -
          "url": "{broker_origin}"
          "description": "Separate ephemeral origin supplied by the local pairing handoff. Not the management server. HTTP loopback only, otherwise TLS 1.3."
          "variables":
            "broker_origin":
              "default": "http://127.0.0.1"
              "description": "Replace with the exact ephemeral pairing broker origin, including its assigned port."
