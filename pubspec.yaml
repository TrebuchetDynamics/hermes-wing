name: wing
description: An independent cross-platform Flutter client for Hermes Agent sessions, streamed runs, approvals, profiles, and device speech.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  uuid: ^4.5.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  web: ^1.1.1
  speech_to_text:
    path: third_party/speech_to_text
  flutter_tts: ^4.2.5
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  crypto: ^3.0.7
  pocket_speech:
    git:
      url: https://github.com/TrebuchetDynamics/pocket-speech-dart.git
      ref: 17f45643e65a834b6852f433e2b4b2c0a6630597
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.2
  markdown: ^7.3.1
  file_selector: ^1.1.0
  betto_lang_detector: ^0.1.0-dev.1
  unorm_dart: ^0.3.2
  sherpa_onnx: ^1.13.4

dependency_overrides:
  malsami:
    path: third_party/malsami

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  speech_to_text_platform_interface: ^2.4.0
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - hermes-wing-icon.png
