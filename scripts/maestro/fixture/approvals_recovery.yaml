appId: com.trebuchetdynamics.hermes.wing.qa
---
- launchApp:
    clearState: true
    stopApp: true
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: Maestro fixture
    timeout: 30000
- runFlow:
    file: open.yaml
    env:
      SCREEN: Chat fixture
- tapOn: '(?s).*Message Hermes.*'
- inputText: Fixture deny turn
- hideKeyboard
- tapOn: '^Send$'
- assertVisible: '(?s).*Fixture approval 1.*'
- tapOn: Review
- assertVisible: Review Hermes approval
- tapOn: '^Deny$'
- assertVisible: '(?s).*Fixture decision deny.*'
- hideKeyboard
- tapOn: Fixture controls
- scrollUntilVisible:
    element:
      text: "Approval decisions: 1"
    direction: DOWN
- assertVisible: "Approval decisions: 1"
- tapOn: Close controls
- tapOn: '(?s).*Message Hermes.*'
- inputText: Fixture stopped turn
- hideKeyboard
- tapOn: '^Send$'
- assertVisible: '(?s).*Fixture approval 2.*'
- tapOn: '^Stop$'
- assertNotVisible: '(?s).*Fixture approval 2.*'
# Stop restores composer focus, which hides its empty placeholder.
- tapOn:
    focused: true
- inputText: Fixture next turn
- hideKeyboard
- tapOn: '^Send$'
- assertVisible: '(?s).*Fixture approval 3.*'
- tapOn: Approve once
- assertVisible: '(?s).*Fixture decision once.*'
- hideKeyboard
- runFlow:
    file: control.yaml
    env:
      ACTION: Disconnect fixture
- runFlow:
    file: control.yaml
    env:
      ACTION: Reconnect fixture
- assertVisible: '^Profiles$'
- tapOn: '(?s).*Fixture gateway.*DEFAULT.*'
- tapOn: Fixture controls
- scrollUntilVisible:
    element:
      text: "Submitted turns: 3"
    direction: DOWN
- assertVisible: "Submitted turns: 3"
- tapOn: Close controls
- tapOn: Fixture controls
- scrollUntilVisible:
    element:
      text: "Approval decisions: 2"
    direction: DOWN
- assertVisible: "Approval decisions: 2"
- tapOn: Close controls
- assertVisible: '(?s).*Fixture decision once.*'
- runFlow:
    file: control.yaml
    env:
      ACTION: Enable earlier history
- scrollUntilVisible:
    element:
      text: Load earlier messages
    direction: UP
- tapOn: Load earlier messages
- assertVisible: '(?s).*Fixture earlier history.*'
- assertNotVisible: Load earlier messages
