appId: com.trebuchetdynamics.hermes.wing.qa
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: Maestro fixture
    timeout: 30000
- runFlow:
    file: open.yaml
    env:
      SCREEN: Pairing fixture
- tapOn: '(?s).*Use another computer.*'
- assertVisible: Set up Wing Link and pair
- tapOn: Wing Link already installed
- assertVisible: '.*wing-link pair.*'
- scrollUntilVisible:
    element:
      text: Open pairing in Wing
    direction: DOWN
- takeScreenshot: computer-setup-and-pair
- assertNotVisible: hermes setup
- tapOn: Open pairing in Wing
- assertVisible: Enter connection string instead
