appId: com.trebuchetdynamics.hermes.wing.qa
---
- launchApp:
    clearState: true
    stopApp: true
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: Maestro fixture
    timeout: 30000
- runFlow:
    file: open.yaml
    env:
      SCREEN: Pairing fixture
- assertVisible: Pairing links are no longer supported
- assertNotVisible: Paste pairing link
- tapOn: Connection options
- assertVisible: Welcome to Hermes Wing
