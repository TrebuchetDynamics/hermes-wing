appId: com.trebuchetdynamics.hermes.wing.qa
---
- launchApp:
    clearState: true
    stopApp: true
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: Maestro fixture
    timeout: 30000
- runFlow:
    file: open.yaml
    env:
      SCREEN: Providers fixture
# Legacy credential route grants never qualify secret mutation or a live probe.
- assertNotVisible: Manage credential
- assertNotVisible: New secret value
- tapOn: Fixture controls
- scrollUntilVisible:
    element:
      text: "Credential writes: 0"
    direction: DOWN
- assertVisible: "Credential writes: 0"
- assertVisible: "Credential removals: 0"
- tapOn: Close controls
- scrollUntilVisible:
    element:
      text: Choose model
    direction: UP
- tapOn: Choose model
- tapOn: '(?s).*Model.*fixture-small.*'
- tapOn: fixture-large
- tapOn: '^Assign$'
- assertVisible: '(?s).*fixture-large.*'
- tapOn: Fixture controls
- scrollUntilVisible:
    element:
      text: "Model writes: 1"
    direction: DOWN
- assertVisible: "Model writes: 1"
- tapOn: Close controls
- scrollUntilVisible:
    element:
      text: Choose model
    direction: UP
- tapOn: Choose model
- runFlow:
    file: control.yaml
    env:
      ACTION: Inject revision conflict
- tapOn: '^Assign$'
- assertVisible: '(?s).*The model selection changed elsewhere. Reopen the picker to try again..*'
- tapOn: '^Assign$'
- tapOn: Fixture controls
- scrollUntilVisible:
    element:
      text: "Model attempts: 3"
    direction: DOWN
- assertVisible: "Model attempts: 3"
- tapOn: Close controls
- tapOn: Fixture controls
- scrollUntilVisible:
    element:
      text: "Model writes: 2"
    direction: DOWN
- assertVisible: "Model writes: 2"
- tapOn: Close controls
- runFlow:
    file: control.yaml
    env:
      ACTION: Revoke write grants
- assertNotVisible: Manage credential
- tapOn: Fixture controls
- scrollUntilVisible:
    element:
      text: "Credential writes: 0"
    direction: DOWN
- assertVisible: "Credential writes: 0"
- tapOn: Close controls
