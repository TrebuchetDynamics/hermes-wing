appId: com.trebuchetdynamics.hermes.wing.qa
---
- launchApp:
    clearState: true
    stopApp: true
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: Maestro fixture
    timeout: 30000
- runFlow:
    file: control.yaml
    env:
      ACTION: Use light theme
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Maestro fixture
    timeout: 30000
- runFlow:
