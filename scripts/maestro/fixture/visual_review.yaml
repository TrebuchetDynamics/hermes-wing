appId: com.trebuchetdynamics.hermes.wing.qa
---
- launchApp:
    clearState: true
    stopApp: true
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: Maestro fixture
    timeout: 30000
- tapOn: Start visual review
- assertVisible: '1 / 26'
- assertVisible: '^Profiles$'
- takeScreenshot: light-profiles
- tapOn: Next screen
- assertVisible: '^Tools$'
- takeScreenshot: light-tools
- tapOn: Next screen
- assertVisible: '^Office$'
- takeScreenshot: light-office
- tapOn: Next screen
- assertVisible: '^Providers$'
- takeScreenshot: light-providers
- tapOn: Next screen
- assertVisible: '^Persona$'
- takeScreenshot: light-soul
- tapOn: Next screen
- assertVisible: '^Gateway$'
- takeScreenshot: light-gateway
- tapOn: Next screen
- assertVisible: '^Settings$'
- takeScreenshot: light-settings
- tapOn: Next screen
- assertVisible: '^Voice & speech$'
- takeScreenshot: light-voice-settings
- tapOn: Next screen
- assertVisible: '^Diagnostics$'
- assertVisible: '(?s).*Model.*Not reported.*'
- takeScreenshot: light-diagnostics
- tapOn: Next screen
- assertVisible: '^Schedules$'
- takeScreenshot: light-schedules
- tapOn: Next screen
- assertVisible: '^What are we working on\?$'
- takeScreenshot: light-chat
- tapOn: Next screen
- assertVisible: '^Connect to Hermes$'
- takeScreenshot: light-pairing
- tapOn: Next screen
- assertVisible: '^Set up Hermes on this phone$'
- takeScreenshot: light-local-setup
- tapOn: Next screen
- assertVisible: '14 / 26'
