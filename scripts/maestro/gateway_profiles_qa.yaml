# Static validation: maestro check-syntax scripts/maestro/gateway_profiles_qa.yaml
# Physical local-profile topology receipt through independent Wing Link control.
# Pass the saved paired gateway label with
# `-e WING_QA_GATEWAY_LABEL="<saved gateway label>"`.
# The temporary `maestroqa2` Hermes profile is deleted before this flow exits.
appId: com.trebuchetdynamics.hermes.wing
name: gateway_profiles_qa
---
- launchApp:
    stopApp: true
- setOrientation: PORTRAIT
- runFlow:
    when:
      visible: "(?s).*Message Hermes….*"
    commands:
      - tapOn: "(?s).*All chats.*"
- tapOn: "Open more destinations"
- tapOn: "^Profiles$"
- assertVisible: "(?s).*Select gateway.*"
- tapOn: "(?s).*Select gateway.*"
- tapOn: "(?s).*${WING_QA_GATEWAY_LABEL}.*"
- extendedWaitUntil:
    visible: "(?s).*New Profile.*"
    timeout: 60000
- assertVisible: "(?s).*default.*"
- assertVisible: "(?s).*link.*"
- scrollUntilVisible:
    element:
      text: "(?s).*mineru.*"
    direction: DOWN
    timeout: 30000
- swipe:
    direction: UP
    duration: 400
- takeScreenshot: gateway_profiles_inventory

# Create a real Hermes profile cloned from default.
- scrollUntilVisible:
    element:
      text: "New Profile"
    direction: UP
    timeout: 30000
- tapOn: "New Profile"
- assertVisible: "Create profile"
- tapOn: "Profile name"
- inputText: "maestroqa"
- hideKeyboard
- tapOn: "^Create$"
- extendedWaitUntil:
    notVisible: "Create profile"
    timeout: 90000
- scrollUntilVisible:
    element:
      text: "(?s).*maestroqa.*"
    direction: DOWN
    timeout: 30000
- swipe:
    direction: UP
    duration: 600
# Chat/SOUL remain unavailable for local-only rows on legacy Hermes endpoints that do
# not advertise profile context. Widget/channel tests cover use when advertised.
# Rename the real stable profile ID. SOUL remains gated by Agent capabilities.
- tapOn: "Edit maestroqa"
- assertVisible: "^Edit$"
- tapOn: "Profile name"
- eraseText: 20
- inputText: "maestroqa2"
- hideKeyboard
- tapOn: "^Save$"
- extendedWaitUntil:
    notVisible: "^Save$"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "(?s).*maestroqa2.*"
    direction: DOWN
    timeout: 30000
- swipe:
    direction: UP
    duration: 600

# Local-only profiles are manageable but are not routed through Wing Link chat.
# Delete the temporary profile with typed confirmation.
- tapOn: "Delete maestroqa2"
- tapOn: "^Delete profile$"
- assertVisible: "(?s).*Delete maestroqa2.*"
- inputText: "maestroqa2"
- hideKeyboard
- tapOn: "^Delete profile$"
- extendedWaitUntil:
    notVisible: "(?s).*maestroqa2.*"
    timeout: 90000
- scrollUntilVisible:
    element:
      text: "(?s).*mineru.*"
    direction: DOWN
    timeout: 30000
- swipe:
    direction: UP
    duration: 400
- takeScreenshot: gateway_profile_status_deleted
