# Static validation: maestro check-syntax scripts/maestro/office_workspace_qa.yaml
# Physical-device flow for the accessible, gateway-authoritative 2D Office.
# Preserves app data and never invokes account, wallet, or profile mutation.
appId: com.trebuchetdynamics.hermes.wing
name: office_workspace_qa
---
- launchApp:
    stopApp: true
- setOrientation: PORTRAIT
- tapOn:
    point: "7%,8%"
- tapOn:
    point: "7%,8%"
- extendedWaitUntil:
    visible: "Open more destinations"
    timeout: 30000
- tapOn: "Open more destinations"
- tapOn: "^Office$"
- assertVisible: "(?s).*accessible 2D workspace.*"
- assertVisible: "(?s).*[1-9][0-9]* profile.*"
- assertVisible: "(?s).*Search profiles and gateways.*"
- tapOn: "(?s).*Search profiles and gateways.*"
- inputText: "qa_no_office_profile_match_98765"
- assertVisible: "(?s).*No profiles match this search.*"
- eraseText: 100
- tapOn: "(?s).*accessible 2D workspace.*"
- assertVisible: "^Open chat$"
- tapOn: "^Open chat$"
- extendedWaitUntil:
    visible: "(?s).*Message Hermes….*"
    timeout: 60000
